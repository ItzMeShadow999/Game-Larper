name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe (bundles discord.py-self, curl_cffi, discord_protos, tzdata)
        run: python Build/build_exe.py

      - name: Smoke test (exe must start and stay up)
        shell: pwsh
        run: |
          if (-not (Test-Path dist\GameLarper.exe)) { throw "dist\GameLarper.exe missing" }
          $p = Start-Process dist\GameLarper.exe -PassThru
          Start-Sleep -Seconds 10
          $exited = $p.HasExited
          taskkill /F /T /PID $p.Id 2>$null | Out-Null
          if (Test-Path dist\larper.log) { Get-Content dist\larper.log }
          if ($exited) { throw "GameLarper.exe exited early with code $($p.ExitCode)" }
          if ((Test-Path dist\larper.log) -and (Select-String -Path dist\larper.log -Pattern "CRASH" -Quiet)) {
            throw "GameLarper.exe logged a crash"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GameLarper
          path: dist/GameLarper.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GameLarper.exe
          generate_release_notes: true
